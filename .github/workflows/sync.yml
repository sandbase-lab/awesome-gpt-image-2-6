name: Sync Lab prompts
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lab-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/sync_lab.py
      - run: python3 scripts/sync_lab.py --check
      - name: Commit changed Lab data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data README.md README.zh-CN.md docs/prompts.md docs/zh-CN/prompts.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync reviewed prompt examples from Lab'
            git push
          fi
